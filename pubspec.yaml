name: lanpulse_p2p
description: Applicazione P2P Wi-Fi e IP Diretto di File Sharing e Messaggistica per Android e Windows (.exe).
publish_to: 'none'
version: 1.4.0+5

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  network_info_plus: ^6.1.4
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  uuid: ^4.5.0
  crypto: ^3.0.5
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  video_player: ^2.9.2
  video_player_win: ^3.1.1
  desktop_drop: ^0.8.4
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
